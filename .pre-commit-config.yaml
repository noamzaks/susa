repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.20
      hooks:
          - id: ruff-check
          - id: ruff-format
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.1.0
      hooks:
          - id: mypy
            args: [--strict, --ignore-missing-imports]
            additional_dependencies:
              - pydantic
              - pydantic-xml