[project]
name = "susa-podman"
version = "0.1.0"
description = "libvirt in a podman container, for SUSA"
authors = [
    { name = "Noam Zaks", email = "noam@noamzaks.com" }
]
requires-python = ">=3.10"
dependencies = [
    "susa-communicators",
    "susa-core",
    "susa-libvirt",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "susa.podman"

[tool.uv.sources]
susa-communicators = { workspace = true }
susa-core = { workspace = true }
susa-libvirt = { workspace = true }
