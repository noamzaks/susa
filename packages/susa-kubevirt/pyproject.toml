[project]
name = "susa-kubevirt"
version = "0.1.0"
description = "KubeVirt backend for SUSA"
authors = [
    { name = "Noam Zaks", email = "noam@noamzaks.com" }
]
requires-python = ">=3.10"
dependencies = [
    "susa-core",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "susa.kubevirt"

[tool.uv.sources]
susa-core = { workspace = true }
