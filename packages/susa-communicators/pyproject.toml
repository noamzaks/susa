[project]
name = "susa-communicators"
version = "0.1.0"
description = "Shells over serial consoles, ssh, telnet and rlogin, and what Unix commands do over them"
authors = [
    { name = "Noam Zaks", email = "noam@noamzaks.com" }
]
requires-python = ">=3.10"
dependencies = [
    "susa-core",
    "pexpect>=4.9.0",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "susa.communicators"

[tool.uv.sources]
susa-core = { workspace = true }
