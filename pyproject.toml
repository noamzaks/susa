# A workspace of SUSA's packages (see `packages/`), developed and tested together.
[project]
name = "susa-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "susa-core",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
susa-core = { workspace = true }
pytest-greendots = { git = "https://github.com/noamzaks/greendots", subdirectory = "pytest-greendots" }

[tool.mypy]
strict = true
files = ["packages/*/src", "tests"]
explicit_package_bases = true
mypy_path = ["typings", "packages/susa-core/src"]
enable_error_code = ["explicit-override"]
# Abstract classes can be asked for (e.g. `cook(recipe, ShellCommunicator)`), as `isinstance` checks them.
disable_error_code = ["type-abstract"]
follow_untyped_imports = true

[tool.pyright]
include = ["packages", "tests"]
typeCheckingMode = "strict"
# pytest-snapshot has none.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = ["--dist", "loadgroup"]

[tool.ruff.lint]
ignore = ["UP035", "LOG015"]

[tool.ruff.lint.per-file-ignores]
# Re-exports fixtures and tests for pytest to find.
"tests/kubevirt/test_shared.py" = ["PLC0414"]

[tool.ruff.lint.isort]
known-first-party = ["susa"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytesseract>=0.3.13",
    "pytest>=9.2.0",
    "pytest-greendots",
    "pytest-snapshot>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.4",
    "scapy>=2.8.0",
]
