# A workspace of SUSA's packages (see `packages/`), developed and tested together.
[project]
name = "susa-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "susa-core",
    "susa-communicator",
    "susa-libvirt",
    "susa-podman",
    "susa-recipes[communicator,libvirt,podman]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
susa-core = { workspace = true }
susa-communicator = { workspace = true }
susa-libvirt = { workspace = true }
susa-podman = { workspace = true }
susa-recipes = { workspace = true }
pydantic-libvirt = { git = "https://github.com/noamzaks/pydantic-libvirt" }

[tool.mypy]
strict = true
files = ["packages/*/src", "tests"]
explicit_package_bases = true
mypy_path = ["packages/susa-core/src", "packages/susa-communicator/src", "packages/susa-libvirt/src", "packages/susa-podman/src", "packages/susa-recipes/src"]
enable_error_code = ["explicit-override"]
# Abstract classes can be asked for (e.g. `cook(recipe, ShellCommunicator)`), as `isinstance` checks them.
disable_error_code = ["type-abstract"]
follow_untyped_imports = true
untyped_calls_exclude = ["pytesseract"]

[tool.pytest.ini_options]
addopts = ["--dist", "loadgroup"]

[tool.ruff.lint]
ignore = ["UP035", "LOG015"]

[tool.ruff.lint.isort]
known-first-party = ["susa"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "pytest-snapshot>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.9",
    "scapy>=2.7.0",
    "types-pexpect>=4.9.0.20260518",
]
